name: codeql

# Static application security testing (SAST) with GitHub CodeQL. Scans the Python source for
# injection, path-traversal, unsafe deserialization and other vulnerability patterns. Results land
# in the repo's Security > Code scanning tab. Free for public repositories.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # weekly (Mon 04:17 UTC) — catches new queries against unchanged code

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # required to upload results to code scanning

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality   # broader than the default security-only pack

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
