version: 2

# Automated dependency-update PRs + security alerts. Two ecosystems: the Python packages the app
# declares, and the GitHub Actions pinned in .github/workflows. Grouped so a bump is one reviewable
# PR per ecosystem, not a flood.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
