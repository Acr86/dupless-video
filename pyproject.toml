[project]
name = "dup-detector"
version = "0.1.3"
description = "Content-based duplicate/upgrade detector for video libraries — a zero-false-positive staged decision tree over independent signals"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "numpy>=1.26",
    "xxhash>=3.4",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    # --- features / ML (install per your hardware; see requirements-gpu.txt) ---
    # "torch",            # CUDA build for your GPU
    # "torchvision",
    # "faiss-gpu",        # or faiss-cpu if no GPU
    # "faster-whisper",
    # "av",               # PyAV (decode, NVDEC)
    # (opencv for the live-view is in the [ui] extra)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "pre-commit>=3.7", "Cython>=3.0"]
ui = ["PySide6>=6.7", "send2trash>=1.8", "opencv-python-headless>=4.8"]   # `dupdetect ui`: Qt app + live-view JPEG encode (cv2.imencode)
# OPTIONAL: native filesystem events for the watcher (ReadDirectoryChangesW / inotify / FSEvents).
# Without it the watcher still works via backoff polling; with it: instant reaction + minimal churn.
watch = ["watchdog>=3.0"]

[project.scripts]
dupdetect = "dupdetect.cli:app"

[tool.setuptools.package-data]
"dupdetect.ui" = ["*.ico", "*.png"]   # the icon ships with the package (also in a non-editable install)

[build-system]
# Cython compiles the optional Pass-2 hot-loop accelerator (align/_fastdp.pyx). It is marked
# optional in setup.py, so a build without a C compiler still succeeds (pure-Python fallback).
requires = ["setuptools>=68", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Helper entry scripts and build outputs are not part of the shipped package — keep them out of the gate.
extend-exclude = ["scripts", "build", "dist", "bundle"]

[tool.ruff.lint]
# Explicit `select` so the gate is deterministic across ruff versions: pycodestyle errors (E),
# pyflakes (F: unused/undefined names), import sorting (I), and safe pyupgrade modernizations (UP).
select = ["E", "F", "I", "UP"]
# E501 (line length): the house style is densely commented; length is not gated (formatter's job).
# E402 (import not at top): several modules import after a __future__/sys guard on purpose.
# E70x (compound statements / semicolons): the house style uses compact `a; b` one-liners on purpose.
# UP031 (printf -> f-string): a few %-joins carry bytes with surrogatepass — f-strings would change semantics.
# UP042 (StrEnum): Verdict subclasses str+Enum deliberately (stable .value serialization to the DB).
ignore = ["E501", "E402", "E701", "E702", "E703", "UP031", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]   # pytest fixtures legitimately shadow imported names (redefinition is intended)
# cli.py imports are split by an early stdout UTF-8 reconfigure (must run before the heavy imports);
# each block is sorted, but isort sees the split as one unsorted block -> ignore just this rule here.
"src/dupdetect/cli.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Types are added incrementally; mypy runs in CI as ADVISORY (non-blocking) until the package is
# fully annotated. Kept here so `mypy src/dupdetect` is reproducible locally and in CI.
